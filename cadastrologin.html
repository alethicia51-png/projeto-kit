<form id="cadastroForm">

    <!-- NOME -->

    <div class="campo">

        <label for="nome">
            Nome completo
        </label>

        <input
            type="text"
            id="nome"
            placeholder="Digite seu nome"
            autocomplete="name"
            required
        >

    </div>


    <!-- EMAIL -->

    <div class="campo">

        <label for="email">
            E-mail
        </label>

        <input
            type="email"
            id="email"
            placeholder="seu@email.com"
            autocomplete="email"
            required
        >

    </div>


    <!-- SENHA -->

    <div class="campo">

        <label for="senha">
            Senha
        </label>

        <input
            type="password"
            id="senha"
            placeholder="Crie uma senha"
            autocomplete="new-password"
            required
        >

    </div>


    <!-- BOTÃO -->

    <button
        type="submit"
        class="botao"
    >
        <span>Criar minha conta</span>
        <strong>→</strong>
    </button>


    <p id="mensagem"></p>


    <div class="divisor
</form>
